spring.application.name=wildfire

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/wildfire}

# NASA FIRMS configuration
nasa.firms.api-key=${NASA_API_KEY}
nasa.firms.base-url=https://firms.modaps.eosdis.nasa.gov/api
nasa.firms.area=-118,7,-77,33

# Administrator authentication
spring.security.user.name=${ADMIN_USERNAME}
spring.security.user.password=${ADMIN_PASSWORD}
spring.security.user.roles=ADMIN

# Deployment configuration
server.port=${PORT:8080}
server.address=0.0.0.0